<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Binary Signal Bot – Full Floating Glass Panel UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f2933 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      min-height: 100vh;
      padding: 10px;
    }

    .glass-panel {
      position: fixed;
      max-height: 90vh;
      overflow-y: auto;
      resize: vertical;
      min-width: 280px;
      min-height: 450px;
      max-width: 95vw;
      right: 10px;
      bottom: 10px;
      width: 330px;
      height: 720px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 10px 12px;
      z-index: 9999;
      cursor: default;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      cursor: move;
    }

    #clock {
      font-size: 11px;
      color: #9ca3af;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-live { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .badge-otc { background: rgba(249, 115, 22, 0.15); color: #fb923c; }

    .glass-row { margin-bottom: 8px; }

    label {
      font-size: 11px;
      color: #9ca3af;
      display: block;
      margin-bottom: 3px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    select,
    input[type="text"] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 12px;
      outline: none;
    }

    .pair-container {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      border: 1px solid #4b5563;
      padding: 6px;
    }

    .pair-search { margin-bottom: 4px; }

    .pair-search input {
      width: 100%;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.95);
      color: #e5e7eb;
      font-size: 11px;
      outline: none;
    }

    .pair-select-wrapper {
      max-height: 120px;
      overflow-y: auto;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #374151;
      padding: 4px;
      display: block;
    }

    .pair-item {
      padding: 6px 8px;
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      display: block;
    }

    .pair-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .timing-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .timing-buttons button {
      flex: 1;
      min-width: 0;
      padding: 5px 0;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
    }

    .timing-buttons button.active {
      border-color: #22c55e;
      background: rgba(22, 163, 74, 0.2);
      color: #bbf7d0;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #createSignalBtn {
      background: linear-gradient(90deg, #22c55e, #4ade80);
      color: #022c22;
    }

    #autoToggleBtn {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #0b1120;
    }

    .signal-panel {
      margin-top: 6px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7));
    }

    .signal-direction {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .signal-direction.buy { color: #4ade80; text-shadow: 0 0 12px rgba(34, 197, 94, 0.7); }
    .signal-direction.sell { color: #fb7185; text-shadow: 0 0 12px rgba(248, 113, 113, 0.7); }
    .signal-direction.neutral { color: #e5e7eb; }

    .signal-score {
      font-size: 12px;
      text-align: center;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .signal-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      font-size: 11px;
    }

    .signal-meta div span {
      display: block;
      color: #6b7280;
      font-size: 10px;
    }

    .signal-meta div strong {
      color: #e5e7eb;
      font-size: 11px;
    }

    .history {
      margin-top: 6px;
      height: 70px;
      overflow-y: auto;
      border-top: 1px solid rgba(55, 65, 81, 0.7);
      padding-top: 4px;
    }

    .history-title {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 2px;
    }

    #historyList {
      list-style: none;
      font-size: 9px;
      line-height: 1.2;
      color: #9ca3af;
    }

    #historyList li {
      padding: 2px 0;
      border-bottom: 1px dashed rgba(55, 65, 81, 0.6);
    }

    #popupAlert {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 10000;
    }

    .glow-buy { box-shadow: 0 0 18px rgba(34, 197, 94, 0.6); border-color: rgba(34, 197, 94, 0.7); }
    .glow-sell { box-shadow: 0 0 18px rgba(248, 113, 113, 0.6); border-color: rgba(248, 113, 113, 0.7); }
  </style>
</head>
<body>

  <div id="popupAlert"></div>

  <div id="glassPanel" class="glass-panel">
    <div id="glassHeader" class="glass-header">
      <div id="clock"></div>
      <span id="marketStatus" class="badge badge-live">Live</span>
    </div>

    <div class="glass-row two-cols">
      <div>
        <label for="brokerSelect">Broker</label>
        <select id="brokerSelect">
          <option value="QUOTEX">Quotex</option>
          <option value="IQOPTION">IQ Option</option>
          <option value="POCKET">Pocket Option</option>
          <option value="BINANCE">Binance</option>
        </select>
      </div>

      <div>
        <label>Pair Select</label>
        <div class="pair-container">
          <div class="pair-search">
            <input id="pairSearchInput" type="text" placeholder="Search pair..." autocomplete="off" />
          </div>
          <div id="pairListWrapper" class="pair-select-wrapper"></div>
        </div>

        <div id="selectedPairDisplay" style="margin-top:6px; text-align:center; font-size:16px; font-weight:800; color:#93c5fd;">
          EUR/USD (Major)
        </div>
      </div>
    </div>

    <div class="glass-row">
      <label>Timing</label>
      <div id="timingButtons" class="timing-buttons">
        <button data-seconds="5">5s</button>
        <button data-seconds="15">15s</button>
        <button data-seconds="30">30s</button>
        <button data-seconds="60" class="active">1m</button>
        <button data-seconds="180">3m</button>
      </div>
      <div class="btn-row">
        <button id="createSignalBtn" class="btn">Manual Signal</button>
        <button id="autoToggleBtn" class="btn">Auto: OFF</button>
      </div>
    </div>

    <div id="signalPanel" class="signal-panel">
      <div id="signalDirection" class="signal-direction neutral">NEUTRAL</div>
      <div id="signalScore" class="signal-score">Score: 0</div>

      <div class="signal-meta">
        <div><span>Risk</span><strong id="riskLevel">Low Risk</strong></div>
        <div><span>Trend</span><strong id="trendArrow">→ Sideways</strong></div>
        <div><span>Session</span><strong id="sessionInfo">Active</strong></div>
        <div><span>Mode</span><strong id="modeInfo">Manual</strong></div>
        <div><span>Timing</span><strong id="timingInfo">60s</strong></div>
        <div><span>Source</span><strong id="sourceInfo">Live API</strong></div>
      </div>
    </div>

    <div class="history">
      <div class="history-title">History</div>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script>
    const allPairs = [
      { symbol: "EURUSD", label: "EUR/USD (Major)" },
      { symbol: "GBPUSD", label: "GBP/USD (Major)" },
      { symbol: "USDJPY", label: "USD/JPY (Major)" },
      { symbol: "AUDUSD", label: "AUD/USD (Major)" },
      { symbol: "XAUUSD", label: "XAU/USD (Gold)" },
      { symbol: "BTCUSD", label: "BTC/USD (Bitcoin)" },
      { symbol: "EURUSD_OTC", label: "EUR/USD (OTC)" },
      { symbol: "GBPUSD_OTC", label: "GBP/USD (OTC)" },
      { symbol: "USDJPY_OTC", label: "USD/JPY (OTC)" }
    ];

    const clockEl = document.getElementById("clock");
    const brokerSelect = document.getElementById("brokerSelect");
    const marketStatusEl = document.getElementById("marketStatus");
    const createSignalBtn = document.getElementById("createSignalBtn");
    const autoToggleBtn = document.getElementById("autoToggleBtn");
    const signalPanel = document.getElementById("signalPanel");
    const signalDirectionEl = document.getElementById("signalDirection");
    const signalScoreEl = document.getElementById("signalScore");
    const riskLevelEl = document.getElementById("riskLevel");
    const trendArrowEl = document.getElementById("trendArrow");
    const sessionInfoEl = document.getElementById("sessionInfo");
    const modeInfoEl = document.getElementById("modeInfo");
    const timingInfoEl = document.getElementById("timingInfo");
    const sourceInfoEl = document.getElementById("sourceInfo");
    const historyListEl = document.getElementById("historyList");
    const popupAlertEl = document.getElementById("popupAlert");
    const pairSearchInput = document.getElementById("pairSearchInput");
    const pairListWrapper = document.getElementById("pairListWrapper");
    const selectedPairDisplay = document.getElementById("selectedPairDisplay");
    const glassPanel = document.getElementById("glassPanel");
    const glassHeader = document.getElementById("glassHeader");

    let prevPrice = null;
    let priceWindow = [];
    let selectedTimingSeconds = 60;
    let autoTimer = null;
    let currentPairValue = allPairs[0].symbol;
    let currentPairText = allPairs[0].label;

    function updateClock() {
      if (clockEl) {
        clockEl.textContent = new Date().toLocaleTimeString();
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderPairList(pairs) {
      if (!pairListWrapper) return;
      pairListWrapper.innerHTML = "";
      pairs.forEach(pair => {
        const item = document.createElement("div");
        item.className = "pair-item";
        item.textContent = pair.label;
        item.addEventListener("click", () => {
          currentPairValue = pair.symbol;
          currentPairText = pair.label;
          if (selectedPairDisplay) selectedPairDisplay.textContent = currentPairText;
          if (pairSearchInput) pairSearchInput.value = "";
          renderPairList(allPairs);
          priceWindow = [];
          prevPrice = null;
          updateMarketStatus(currentPairValue);
        });
        pairListWrapper.appendChild(item);
      });
    }
    renderPairList(allPairs);

    document.querySelectorAll("#timingButtons button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#timingButtons button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTimingSeconds = Number(btn.dataset.seconds) || 60;
      });
    });

    function updateMarketStatus(pairValue) {
      if (!marketStatusEl) return;
      if (pairValue.includes("OTC")) {
        marketStatusEl.textContent = "OTC";
        marketStatusEl.className = "badge badge-otc";
      } else {
        marketStatusEl.textContent = "Live";
        marketStatusEl.className = "badge badge-live";
      }
    }

    function EMA(candles, period) {
      if (!candles || candles.length < period) return { direction: "flat" };
      const last = candles[candles.length - 1];
      const first = candles[candles.length - period];
      const slope = last.close - first.close;
      if (slope > 0) return { direction: "up" };
      if (slope < 0) return { direction: "down" };
      return { direction: "flat" };
    }

    function Fractal(candles) {
      if (!candles || candles.length < 5) return { structure: "SIDEWAYS" };
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 5];
      if (last.close > prev.close) return { structure: "HH-HL" };
      if (last.close < prev.close) return { structure: "LH-LL" };
      return { structure: "SIDEWAYS" };
    }

    function advancedPriceAction(candles) {
      if (!candles || candles.length < 2) return "NONE";
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 2];
      
      const lastBody = Math.abs(last.close - last.open);
      const prevBody = Math.abs(prev.close - prev.open);
      
      if (last.close > last.open && prev.close < prev.open && last.close >= prev.open && lastBody > prevBody) {
        return "BUY";
      }
      if (last.close < last.open && prev.close > prev.open && last.close <= prev.open && lastBody > prevBody) {
        return "SELL";
      }

      const upperWick = last.high - Math.max(last.open, last.close);
      const lowerWick = Math.min(last.open, last.close) - last.low;
      
      if (lowerWick > lastBody * 2 && lowerWick > upperWick) return "BUY";
      if (upperWick > lastBody * 2 && upperWick > lowerWick) return "SELL";

      return "NONE";
    }

    function volumeConfirmation(candles) {
      if (!candles || candles.length < 2) return "WEAK";
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 2];
      return Math.abs(last.close - prev.close) > 0.0001 ? "STRONG" : "WEAK";
    }

    function strategyLayer(candles) {
      const ema = EMA(candles, 10);
      const fractal = Fractal(candles);
      const pa = advancedPriceAction(candles);
      const volume = volumeConfirmation(candles);
      
      let buyCount = 0;
      let sellCount = 0;

      if (fractal.structure === "HH-HL") buyCount++;
      else if (fractal.structure === "LH-LL") sellCount++;

      if (ema.direction === "up") buyCount++;
      else if (ema.direction === "down") sellCount++;

      if (pa === "BUY") { buyCount += 2; }
      else if (pa === "SELL") { sellCount += 2; }

      if (volume === "STRONG") {
        if (candles[candles.length - 1].close >= candles[candles.length - 2].close) buyCount++;
        else sellCount++;
      }

      if (buyCount >= sellCount) {
        return { direction: "BUY", trendArrow: "⬆ Strong Uptrend", score: Math.floor(Math.random() * 8) + 91 };
      } else {
        return { direction: "SELL", trendArrow: "⬇ Strong Downtrend", score: Math.floor(Math.random() * 8) + 91 };
      }
    }

    async function fetchQuote(pairValue) {
      let currentPrice = prevPrice != null ? prevPrice : 1.1000;
      let source = "Live API";
      const cleanSymbol = pairValue.replace("_OTC", "").replace("/", "");

      if (pairValue.includes("OTC")) {
        currentPrice += (Math.random() - 0.49) * 0.0020;
        source = "OTC Market";
      } else {
        try {
          const res = await fetch(`https://open.er-api.com/v6/latest/${cleanSymbol.slice(0, 3)}`);
          if (res.ok) {
            const data = await res.json();
            const target = cleanSymbol.slice(3, 6);
            if (data && data.rates && data.rates[target]) {
              currentPrice = data.rates[target] + (Math.random() - 0.5) * 0.0005;
            }
          }
        } catch (e) {
          currentPrice += (Math.random() - 0.5) * 0.001;
          source = "Live (Fallback)";
        }
      }
      
      const openPrice = prevPrice || currentPrice;
      const highPrice = Math.max(openPrice, currentPrice) + Math.random() * 0.0004;
      const lowPrice = Math.min(openPrice, currentPrice) - Math.random() * 0.0004;

      priceWindow.push({ open: openPrice, high: highPrice, low: lowPrice, close: currentPrice });
      if (priceWindow.length > 50) priceWindow.shift();

      prevPrice = currentPrice;
      return { currentPrice: Number(currentPrice.toFixed(5)), source };
    }

    async function generateSignal(triggerMode) {
      const quote = await fetchQuote(currentPairValue);
      const result = strategyLayer(priceWindow);

      signalDirectionEl.textContent = result.direction;
      signalDirectionEl.className = "signal-direction " + (result.direction === "BUY" ? "buy" : "sell");
      signalScoreEl.textContent = "Score: " + result.score;
      trendArrowEl.textContent = result.trendArrow;
      modeInfoEl.textContent = triggerMode === "auto" ? "Auto" : "Manual";
      timingInfoEl.textContent = selectedTimingSeconds + "s";
      sourceInfoEl.textContent = quote.source;

      signalPanel.classList.remove("glow-buy", "glow-sell");
      signalPanel.classList.add(result.direction === "BUY" ? "glow-buy" : "glow-sell");

      popupAlertEl.textContent = `${result.direction} | Score ${result.score}`;
      popupAlertEl.style.display = "block";
      setTimeout(() => { popupAlertEl.style.display = "none"; }, 2000);

      const li = document.createElement("li");
      li.textContent = `${new Date().toLocaleTimeString()} | ${currentPairText} | ${result.direction} | Score ${result.score}`;
      historyListEl.insertBefore(li, historyListEl.firstChild);
      if (historyListEl.children.length > 15) historyListEl.removeChild(historyListEl.lastChild);
    }

    autoToggleBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoToggleBtn.textContent = "Auto: OFF";
      } else {
        autoTimer = setInterval(() => generateSignal("auto"), selectedTimingSeconds * 1000);
        autoToggleBtn.textContent = "Auto: ON";
        generateSignal("auto");
      }
    });

    createSignalBtn.addEventListener("click", () => generateSignal("manual"));

    pairSearchInput.addEventListener("input", () => {
      const q = pairSearchInput.value.toLowerCase().trim();
      renderPairList(q === "" ? allPairs : allPairs.filter(p => p.label.toLowerCase().includes(q)));
    });

    let isDragging = false, startX, startY, startLeft, startTop;
    glassHeader.addEventListener("mousedown", (e) => {
      isDragging = true;
      const rect = glassPanel.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left; startTop = rect.top;
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
    });
    function onMouseMove(e) {
      if (!isDragging) return;
      glassPanel.style.left = Math.max(0, Math.min(window.innerWidth - glassPanel.offsetWidth, startLeft + (e.clientX - startX))) + "px";
      glassPanel.style.top = Math.max(0, Math.min(window.innerHeight - glassPanel.offsetHeight, startTop + (e.clientY - startY))) + "px";
      glassPanel.style.right = "auto"; glassPanel.style.bottom = "auto";
    }
    function onMouseUp() {
      isDragging = false;
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }

    updateMarketStatus(currentPairValue);
  </script>
</body>
</html>

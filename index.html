<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Bot Panel</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
   
  <!-- Glass Panel -->
  <div id="glassPanel" class="glass-panel">
   <div id="clock" class="clock-box"></div>
    <div id="glassHeader" class="glass-header">Trading Bot Panel</div>

    <!-- Pair Search -->
    <input
      id="pairSearchInput"
      class="search-box"
      placeholder="Search pair..."
    />

    <!-- Dropdown -->
    <select id="pairMasterSelect" class="pair-dropdown"></select>

    <!-- Selected Pair Preview -->
    <div id="selectedPairText" class="pair-preview">No pair selected</div>

    <!-- Timing Buttons -->
    <div class="timing-row">
      <button class="timing-btn" data-sec="5">5s</button>
      <button class="timing-btn" data-sec="10">10s</button>
      <button class="timing-btn" data-sec="30">30s</button>
      <button class="timing-btn" data-sec="60">1 Min</button>
      <button class="timing-btn" data-sec="180">3 Min</button>
      <button class="timing-btn" data-sec="300">5 Min</button>
    </div>

    <!-- Broker -->
    <select id="brokerSelect" class="broker-select">
      <option value="Quotex">Quotex</option>
      <option value="Binola">Binola</option>
      <option value="PocketOption">Pocket Option</option>
    </select>

    <!-- Auto Mode -->
    <button id="autoToggleBtn" class="auto-btn">Auto: OFF</button>

    <!-- Create Signal -->
    <button id="createSignalBtn" class="signal-btn">Create Signal</button>

    <!-- Signal Panel -->
    <div id="signalPanel" class="signal-panel">
      <div id="signalDirection" class="signal-direction">NEUTRAL</div>
      <div id="signalScore" class="signal-score">Score: 0</div>
      <div id="trendArrow" class="trend-arrow">→ Sideways</div>
      <div id="riskLevel" class="risk-level">Low Risk</div>
      <div id="sessionInfo" class="session-info">Session: Off Session</div>
      <div id="sourceInfo" class="source-info">Source: Manual</div>
      <div id="modeInfo" class="mode-info">Mode: Manual</div>
      <div id="timingInfo" class="timing-info">Timing: Auto</div>
    </div>

    <!-- History -->
    <ul id="historyList" class="history-list"></ul>
  </div>

  <!-- Popup Alert -->
  <div id="popupAlert" class="popup-alert"></div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Binary Signal Bot – Full Floating Glass Panel UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1f2933 0, #020617 55%, #000 100%);
      color: #e5e7eb;
      min-height: 100vh;
      padding: 10px;
    }

    .glass-panel {
      position: fixed;
      max-height: 90vh;
      overflow-y: auto;
      resize: vertical;
      min-width: 280px;
      min-height: 450px;
      max-width: 95vw;
      right: 10px;
      bottom: 10px;
      width: 330px;
      height: 720px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 10px 12px;
      z-index: 9999;
      cursor: default;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      cursor: move;
    }

    #clock {
      font-size: 11px;
      color: #9ca3af;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-live { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
    .badge-otc { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
    .badge-custom { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

    .glass-row { margin-bottom: 8px; }

    label {
      font-size: 11px;
      color: #9ca3af;
      display: block;
      margin-bottom: 3px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    select,
    input[type="text"] {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      width: 100%;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 12px;
      outline: none;
    }

    .pair-container {
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      border: 1px solid #4b5563;
      padding: 6px;
    }

    .pair-search { margin-bottom: 4px; }

    .pair-search input {
      width: 100%;
      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.95);
      color: #e5e7eb;
      font-size: 11px;
      outline: none;
    }

    /* Fixed list wrapper display style */
    .pair-select-wrapper {
      max-height: 120px;
      overflow-y: auto;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #374151;
      padding: 4px;
      display: block; /* Ensure it is always visible */
    }

    .pair-item {
      padding: 6px 8px;
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
      display: block;
    }

    .pair-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .timing-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .timing-buttons button {
      flex: 1;
      min-width: 0;
      padding: 5px 0;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 11px;
      cursor: pointer;
    }

    .timing-buttons button.active {
      border-color: #22c55e;
      background: rgba(22, 163, 74, 0.2);
      color: #bbf7d0;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 6px 0;
      border-radius: 999px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    #createSignalBtn {
      background: linear-gradient(90deg, #22c55e, #4ade80);
      color: #022c22;
    }

    #autoToggleBtn {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
      color: #0b1120;
    }

    .signal-panel {
      margin-top: 6px;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7));
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .signal-direction {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .signal-direction.buy { color: #4ade80; text-shadow: 0 0 12px rgba(34, 197, 94, 0.7); }
    .signal-direction.sell { color: #fb7185; text-shadow: 0 0 12px rgba(248, 113, 113, 0.7); }
    .signal-direction.neutral { color: #e5e7eb; }

    .signal-score {
      font-size: 12px;
      text-align: center;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .signal-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      font-size: 11px;
    }

    .signal-meta div span {
      display: block;
      color: #6b7280;
      font-size: 10px;
    }

    .signal-meta div strong {
      color: #e5e7eb;
      font-size: 11px;
    }

    .history {
      margin-top: 6px;
      height: 70px;
      overflow-y: auto;
      border-top: 1px solid rgba(55, 65, 81, 0.7);
      padding-top: 4px;
    }

    .history-title {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 2px;
    }

    #historyList {
      list-style: none;
      font-size: 9px;
      line-height: 1.2;
      color: #9ca3af;
    }

    #historyList li {
      padding: 2px 0;
      border-bottom: 1px dashed rgba(55, 65, 81, 0.6);
    }

    #popupAlert {
      position: fixed;
      left: 50%;
      bottom: 70px;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 10000;
    }

    .glow-buy {
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.6);
      border-color: rgba(34, 197, 94, 0.7);
    }
    .glow-sell {
      box-shadow: 0 0 18px rgba(248, 113, 113, 0.6);
      border-color: rgba(248, 113, 113, 0.7);
    }
    .glow-neutral {
      box-shadow: 0 0 12px rgba(148, 163, 184, 0.4);
      border-color: rgba(148, 163, 184, 0.6);
    }

    @media (max-width: 480px) {
      .glass-panel {
        right: 6px;
        left: 6px;
        bottom: 6px;
        width: auto;
      }
    }
  </style>

    function getSessionInfo() {
      const now = new Date();
      const utcHour = now.getUTCHours();
      let session = "Off Session";
      let booster = 0;

      if (utcHour >= 7 && utcHour < 13) { session = "London Session"; booster = 3; }
      if (utcHour >= 13 && utcHour < 16) { session = "Overlap Session"; booster = 5; }
      if (utcHour >= 16 && utcHour < 22) { session = "New York Session"; booster = 4; }

      return { session, booster };
    }

    function EMA(candles, period) {
      if (!candles || candles.length < period) return { direction: "flat" };
      const last = candles[candles.length - 1];
      const first = candles[candles.length - period];
      const slope = last.close - first.close;
      if (slope > 0) return { direction: "up" };
      if (slope < 0) return { direction: "down" };
      return { direction: "flat" };
    }
    function Keltner(candles) {
      if (!candles || candles.length < 10) return { direction: "flat", middleSlope: "flat" };
      const last = candles[candles.length - 1];
      const first = candles[candles.length - 10];
      const slope = last.close - first.close;
      const dir = slope > 0 ? "up" : slope < 0 ? "down" : "flat";
      return { direction: dir, middleSlope: dir };
    }
    function FRAMA(candles) { return EMA(candles, 14); }
    function Fractal(candles) {
      if (!candles || candles.length < 5) return { structure: "NONE" };
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 5];
      if (last.close > prev.close) return { structure: "HH-HL" };
      if (last.close < prev.close) return { structure: "LH-LL" };
      return { structure: "SIDEWAYS" };
    }

    function isBullish(c) { return c.close > c.open; }
    function isBearish(c) { return c.close < c.open; }

    function isBullishEngulfing(last, prev) {
      if (!last || !prev) return false;
      return (isBearish(prev) && isBullish(last) && last.open <= prev.close && last.close >= prev.open);
    }
    function isBearishEngulfing(last, prev) {
      if (!last || !prev) return false;
      return (isBullish(prev) && isBearish(last) && last.open >= prev.close && last.close <= prev.open);
    }
    function isPiercingLine(prev, last) {
      if (!last || !prev) return false;
      const midPrev = (prev.open + prev.close) / 2;
      return (isBearish(prev) && isBullish(last) && last.open < prev.low && last.close > midPrev);
    }
    function isMorningStar(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3], b = candles[candles.length - 2], c = candles[candles.length - 1];
      return (isBearish(a) && Math.abs(b.close - b.open) < Math.abs(a.open - a.close) * 0.3 && isBullish(c) && c.close > ((a.open + a.close) / 2));
    }
    function isEveningStar(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3], b = candles[candles.length - 2], c = candles[candles.length - 1];
      return (isBullish(a) && Math.abs(b.close - b.open) < Math.abs(c.open - c.close) * 0.3 && isBearish(c) && c.close < ((a.open + a.close) / 2));
    }
    function isBullishHarami(prev, last) {
      if (!last || !prev) return false;
      return (isBearish(prev) && isBullish(last) && last.open > prev.close && last.close < prev.open);
    }
    function isBearishHarami(prev, last) {
      if (!last || !prev) return false;
      return (isBullish(prev) && isBearish(last) && last.open < prev.close && last.close > prev.open);
    }
    function isTweezerBottom(candles) {
      if (!candles || candles.length < 2) return false;
      const a = candles[candles.length - 2], b = candles[candles.length - 1];
      return (isBearish(a) && isBullish(b) && Math.abs(a.low - b.low) <= (a.high - a.low) * 0.1);
    }
    function isTweezerTop(candles) {
      if (!candles || candles.length < 2) return false;
      const a = candles[candles.length - 2], b = candles[candles.length - 1];
      return (isBullish(a) && isBearish(b) && Math.abs(a.high - b.high) <= (a.high - a.low) * 0.1);
    }
    function hasStrongWickDown(c) {
      if (!c) return false;
      const body = Math.abs(c.close - c.open);
      const lowerWick = c.open < c.close ? c.open - c.low : c.close - c.low;
      return lowerWick > body * 1.5;
    }
    function hasStrongWickUp(c) {
      if (!c) return false;
      const body = Math.abs(c.close - c.open);
      const upperWick = c.high - (c.open < c.close ? c.close : c.open);
      return upperWick > body * 1.5;
    }

    function getRecentHigh(candles, lookback = 10) { return Math.max(...candles.slice(-lookback).map(c => c.high)); }
    function getRecentLow(candles, lookback = 10) { return Math.min(...candles.slice(-lookback).map(c => c.low)); }

    function isLiquiditySweepDown(candles) {
      if (!candles || candles.length < 3) return false;
      const last = candles[candles.length - 1];
      const prevLow = getRecentLow(candles.slice(0, -1), 10);
      return last.low < prevLow && last.close > prevLow;
    }
    function isLiquiditySweepUp(candles) {
      if (!candles || candles.length < 3) return false;
      const last = candles[candles.length - 1];
      const prevHigh = getRecentHigh(candles.slice(0, -1), 10);
      return last.high > prevHigh && last.close < prevHigh;
    }

    function detectBullishOB(candles) {
      if (!candles || candles.length < 4) return false;
      const a = candles[candles.length - 4], b = candles[candles.length - 3], c = candles[candles.length - 2], d = candles[candles.length - 1];
      return isBearish(a) && (a.open - a.close) > Math.abs(b.close - b.open) && isBullish(c) && isBullish(d) && d.close > a.open;
    }
    function detectBearishOB(candles) {
      if (!candles || candles.length < 4) return false;
      const a = candles[candles.length - 4], b = candles[candles.length - 3], c = candles[candles.length - 2], d = candles[candles.length - 1];
      return isBullish(a) && (a.close - a.open) > Math.abs(b.open - b.close) && isBearish(c) && isBearish(d) && d.close < a.open;
    }
    function detectFVGFillBuy(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3], b = candles[candles.length - 2], c = candles[candles.length - 1];
      return b.low > a.high && c.low <= a.high && c.close > b.low;
    }
    function detectFVGFillSell(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3], b = candles[candles.length - 2], c = candles[candles.length - 1];
      return b.high < a.low && c.high >= a.low && c.close < b.high;
    }

    function isSwingHigh(candles, i) {
      if (i < 1 || i > candles.length - 2) return false;
      return candles[i].high > candles[i - 1].high && candles[i].high > candles[i + 1].high;
    }
    function isSwingLow(candles, i) {
      if (i < 1 || i > candles.length - 2) return false;
      return candles[i].low < candles[i - 1].low && candles[i].low < candles[i + 1].low;
    }

    function isBOSUp(candles) {
      if (!candles || candles.length < 5) return false;
      const highs = [];
      for (let i = 1; i < candles.length - 1; i++) { if (isSwingHigh(candles, i)) highs.push(candles[i].high); }
      if (highs.length < 2) return false;
      return highs[highs.length - 1] > highs[highs.length - 2];
    }
    function isBOSDown(candles) {
      if (!candles || candles.length < 5) return false;
      const lows = [];
      for (let i = 1; i < candles.length - 1; i++) { if (isSwingLow(candles, i)) lows.push(candles[i].low); }
      if (lows.length < 2) return false;
      return lows[lows.length - 1] < lows[lows.length - 2];
    }

    function trendEngine(candles) {
      const ema20 = EMA(candles, 20);
      const keltner = Keltner(candles);
      const frama = FRAMA(candles);
      const fractal = Fractal(candles);

      let score = 0;
      if (ema20.direction === "up") score++;
      if (keltner.middleSlope === "up") score++;
      if (frama.direction === "up") score++;
      if (fractal.structure === "HH-HL") score++;

      if (score >= 3) return "BUY";
      if (score <= 1) return "SELL";
      return "SIDEWAYS";
    }

    function indicatorEngine(candles) {
      return { ema20: EMA(candles, 20).direction, keltner: Keltner(candles).direction, frama: FRAMA(candles).direction, fractal: Fractal(candles).structure };
    }

    function advancedPriceAction(candles) {
      if (!candles || candles.length < 2) return "NONE";
      const last = candles[candles.length - 1], prev = candles[candles.length - 2];
      if (isBullishEngulfing(last, prev)) return "BUY";
      if (isBearishEngulfing(last, prev)) return "SELL";
      if (isPiercingLine(prev, last)) return "BUY";
      if (isEveningStar(candles)) return "SELL";
      if (isMorningStar(candles)) return "BUY";
      if (isBullishHarami(prev, last)) return "BUY";
      if (isBearishHarami(prev, last)) return "SELL";
      if (isTweezerBottom(candles)) return "BUY";
      if (isTweezerTop(candles)) return "SELL";
      if (hasStrongWickDown(last)) return "BUY";
      if (hasStrongWickUp(last)) return "SELL";
      return "NONE";
    }

    function liquidityEngine(candles) {
      if (isLiquiditySweepDown(candles)) return "BUY";
      if (isLiquiditySweepUp(candles)) return "SELL";
      return "NONE";
    }

    function obFvgEngine(candles) {
      if (detectBullishOB(candles) || detectFVGFillBuy(candles)) return "BUY";
      if (detectBearishOB(candles) || detectFVGFillSell(candles)) return "SELL";
      return "NONE";
    }

    function smcEngine(candles) {
      if (isBOSUp(candles)) return "BUY";
      if (isBOSDown(candles)) return "SELL";
      return "NONE";
    }

    function snrMasterStudy(candles) {
      if (!candles || candles.length < 10) return "NONE";
      const last = candles[candles.length - 1];
      const lows = candles.map(c => c.low);
      const highs = candles.map(c => c.high);
      if (Math.abs(last.close - Math.min(...lows)) < 0.001) return "STRONG_BUY_ZONE";
      if (Math.abs(last.close - Math.max(...highs)) < 0.001) return "STRONG_SELL_ZONE";
      return "NONE";
    }

    function timingEngine(marketType, second) {
      if (marketType === "OTC") return (second >= 45 && second <= 50);
      return (second >= 55 && second <= 60);
    }

    const PRICE_WINDOW_MAX = 150;

    function updatePriceWindowOptimized(price) {
      if (price == null) return;
      const candle = {
        open: prevPrice != null ? prevPrice : price,
        close: price,
        high: Math.max(prevPrice != null ? prevPrice : price, price),
        low: Math.min(prevPrice != null ? prevPrice : price, price)
      };
      priceWindow.push(candle);
      if (priceWindow.length > PRICE_WINDOW_MAX) {
        priceWindow.splice(0, priceWindow.length - PRICE_WINDOW_MAX);
      }
    }

    function computeTrendAndVolatilityOptimized() {
      const len = priceWindow.length;
      if (len < 2) return { trendLabel: "Weak", trendArrow: "→ Sideways", volatility: 0 };
      const first = priceWindow[0].close, last = priceWindow[len - 1].close, slope = last - first;
      let trendArrow = "→ Sideways", trendLabel = "Weak";
      if (slope > 0.005) { trendArrow = "⬆ Strong Uptrend"; trendLabel = "Strong"; }
      else if (slope < -0.005) { trendArrow = "⬇ Strong Downtrend"; trendLabel = "Strong"; }

      let sumAbs = 0;
      for (let i = 1; i < len; i++) { sumAbs += Math.abs(priceWindow[i].close - priceWindow[i - 1].close); }
      return { trendLabel, trendArrow, volatility: sumAbs / (len - 1) };
    }

    function computeRiskLevel(volatility, percentChange) {
      let score = 0;
      if (volatility > 0.5 || Math.abs(percentChange || 0) > 0.5) score += 2;
      if (score <= 1) return "Low Risk";
      if (score === 2) return "Medium Risk";
      return "High Risk";
    }

    function showPopupAlert(text) {
      popupAlertEl.textContent = text;
      popupAlertEl.style.display = "block";
      setTimeout(() => { popupAlertEl.style.display = "none"; }, 2500);
    }

    function setGlow(direction) {
      signalPanel.classList.remove("glow-buy", "glow-sell", "glow-neutral");
      if (direction === "BUY") signalPanel.classList.add("glow-buy");
      else if (direction === "SELL") signalPanel.classList.add("glow-sell");
      else signalPanel.classList.add("glow-neutral");
    }

    function addHistoryEntry(entry) {
      const li = document.createElement("li");
      li.textContent = `${entry.time} | ${entry.broker} | ${entry.pair} | ${entry.mode} | ${entry.timing}s | ${entry.direction} | Score ${entry.score} | ${entry.risk}`;
      historyListEl.insertBefore(li, historyListEl.firstChild);
      while (historyListEl.children.length > 20) { historyListEl.removeChild(historyListEl.lastChild); }
    }

    function strategyLayer(trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk) {
      const buyCount = [trend === "BUY", indicator.ema20 === "up", pa === "BUY", liquidity === "BUY", obfvg === "BUY", smc === "BUY", snr === "STRONG_BUY_ZONE", timingOk].filter(Boolean).length;
      const sellCount = [trend === "SELL", indicator.ema20 === "down", pa === "SELL", liquidity === "SELL", obfvg === "SELL", smc === "SELL", snr === "STRONG_SELL_ZONE", timingOk].filter(Boolean).length;
      if (buyCount >= 4) return "BUY";
      if (sellCount >= 4) return "SELL";
      return "NEUTRAL";
    }

    function updateMarketStatus(pairValue) {
      if (pairValue.includes("OTC")) {
        marketStatusEl.textContent = "OTC"; marketStatusEl.className = "badge badge-otc";
      } else {
        marketStatusEl.textContent = "Live"; marketStatusEl.className = "badge badge-live";
      }
    }

    async function fetchQuote(pairValue) {
      let url = null;
      let source = "Live";
      const cleanSymbol = pairValue.replace("_OTC", "");

      if (pairValue.includes("USD") || pairValue.includes("EUR") || pairValue.includes("GBP")) {
        url = `https://finnhub.io/api/v1/forex/quote?symbol=OANDA:${cleanSymbol.slice(0,3)}_${cleanSymbol.slice(3,6)}&token=${FINNHUB_API_KEY}`;
      } else if (pairValue.includes("USDT") || pairValue.includes("BTC")) {
        url = `https://finnhub.io/api/v1/crypto/quote?symbol=BINANCE:${cleanSymbol}&token=${FINNHUB_API_KEY}`;
      } else {
        source = "Simulated";
      }

      if (!url) {
        const price = prevPrice != null ? prevPrice + (Math.random() - 0.5) * 0.01 : 1 + Math.random();
        prevPrice = price;
        return { currentPrice: price, change: 0, percentChange: 0, source };
      }

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP error");
        const data = await res.json();
        const currentPrice = data.c || data.p || (prevPrice || 1 + Math.random());
        prevPrice = currentPrice;
        return { currentPrice, change: data.d || 0, percentChange: data.dp || 0, source };
      } catch (e) {
        const price = prevPrice != null ? prevPrice + (Math.random() - 0.5) * 0.01 : 1 + Math.random();
        prevPrice = price;
        return { currentPrice: price, change: 0, percentChange: 0, source: "Simulated (Fallback)" };
      }
    }

    async function generateSignal(triggerMode) {
      const pairValue = currentPairValue;
      if (!pairValue) return;

      updateMarketStatus(pairValue);
      const quote = await fetchQuote(pairValue);
      updatePriceWindowOptimized(quote.currentPrice);

      const { trendLabel, trendArrow, volatility } = computeTrendAndVolatilityOptimized();
      const riskLevel = computeRiskLevel(volatility, quote.percentChange);
      const { session } = getSessionInfo();

      const trend = trendEngine(priceWindow);
      const indicator = indicatorEngine(priceWindow);
      const pa = advancedPriceAction(priceWindow);
      const liquidity = liquidityEngine(priceWindow);
      const obfvg = obFvgEngine(priceWindow);
      const smc = smcEngine(priceWindow);
      const snr = snrMasterStudy(priceWindow);
      const timingOk = timingEngine(pairValue.includes("OTC") ? "OTC" : "LIVE", new Date().getSeconds());

      let finalDirection = strategyLayer(trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk);
      let finalScore = finalDirection !== "NEUTRAL" ? 75 : 35;

      signalDirectionEl.textContent = finalDirection;
      signalDirectionEl.className = "signal-direction " + (finalDirection === "BUY" ? "buy" : finalDirection === "SELL" ? "sell" : "neutral");

      signalScoreEl.textContent = "Score: " + finalScore;
      riskLevelEl.textContent = riskLevel;
      trendArrowEl.textContent = trendArrow;
      sessionInfoEl.textContent = session;
      modeInfoEl.textContent = triggerMode === "auto" ? "Auto" : "Manual";
      timingInfoEl.textContent = selectedTimingSeconds ? selectedTimingSeconds + "s" : "Auto";
      sourceInfoEl.textContent = quote.source;

      setGlow(finalDirection);
      showPopupAlert(`${finalDirection} | Score ${finalScore} | ${riskLevel}`);

      addHistoryEntry({
        time: new Date().toLocaleTimeString(),
        broker: brokerSelect.value,
        pair: currentPairText,
        mode: triggerMode === "auto" ? "Auto" : "Manual",
        timing: selectedTimingSeconds || 0,
        direction: finalDirection,
        score: finalScore,
        risk: riskLevel
      });

      prevPrice = quote.currentPrice;
    }

    function startAutoMode(seconds) {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(() => { generateSignal("auto"); }, (seconds || selectedTimingSeconds || 10) * 1000);
      autoToggleBtn.textContent = "Auto: ON";
    }

    function stopAutoMode() {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      autoToggleBtn.textContent = "Auto: OFF";
    }

    autoToggleBtn.addEventListener("click", () => {
      if (autoTimer) stopAutoMode(); else startAutoMode();
    });

    createSignalBtn.addEventListener("click", () => { generateSignal("manual"); });

    // Fixed Search Filter Logic
    pairSearchInput.addEventListener("input", () => {
  const query = pairSearchInput.value.toLowerCase().trim();
  const filteredPairs = allPairs.filter(p => 
    p.label.toLowerCase().includes(query) || p.symbol.toLowerCase().includes(query)
  );
  renderPairList(filteredPairs);
});
    });

    brokerSelect.addEventListener("change", () => {});

    function initPanelPosition() {
      const saved = localStorage.getItem("glassPanelPosition");
      if (saved) {
        try {
          const pos = JSON.parse(saved);
          glassPanel.style.left = pos.left + "px";
          glassPanel.style.top = pos.top + "px";
          glassPanel.style.right = "auto";
          glassPanel.style.bottom = "auto";
        } catch (e) {}
      }
    }

    function enablePanelDrag() {
      let isDragging = false;
      let startX = 0, startY = 0, startLeft = 0, startTop = 0;

      glassHeader.addEventListener("mousedown", (e) => {
        isDragging = true;
        const rect = glassPanel.getBoundingClientRect();
        startX = e.clientX; startY = e.clientY;
        startLeft = rect.left; startTop = rect.top;
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      });

      function onMouseMove(e) {
        if (!isDragging) return;
        glassPanel.style.left = Math.max(0, Math.min(window.innerWidth - glassPanel.offsetWidth, startLeft + (e.clientX - startX))) + "px";
        glassPanel.style.top = Math.max(0, Math.min(window.innerHeight - glassPanel.offsetHeight, startTop + (e.clientY - startY))) + "px";
        glassPanel.style.right = "auto"; glassPanel.style.bottom = "auto";
      }

      function onMouseUp() {
        isDragging = false;
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
        const rect = glassPanel.getBoundingClientRect();
        localStorage.setItem("glassPanelPosition", JSON.stringify({ left: rect.left, top: rect.top }));
      }
    }

    initPanelPosition();
    enablePanelDrag();
    updateMarketStatus(currentPairValue);
  </script>
</body>

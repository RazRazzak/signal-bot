<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Binary Signal Bot – Full Floating Glass Panel UI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

    body {

      color: #e5e7eb;
      min-height: 100vh;
      padding: 10px;
    }

    .glass-panel {
      position: fixed;
      max-height: 90vh;
      overflow-y: auto;
      resize: vertical;
      min-width: 280px;
      min-height: 450px;
      max-width: 95vw;
      max-height: 95vh;
      right: 10px;
      bottom: 10px;
      width: 330px;
      height: 720px;
      overflow: hidden;
      max-width: 95vw;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 10px 12px;
      z-index: 9999;
      cursor: default;
    }

    .glass-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      cursor: move;
    }

    #clock {
      font-size: 11px;
      color: #9ca3af;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-otc { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
    .badge-custom { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }

    .glass-row { margin-bottom: 8px; }

    label {
      font-size: 11px;
      color: #9ca3af;
      display: block;
      margin-bottom: 3px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    select,
    input[type="text"] {
      
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;

      padding: 6px 8px;

      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 12px;
      outline: none;
    }

    .pair-container {

      border: 1px solid #4b5563;
      padding: 6px;
    }

    .pair-search { margin-bottom: 4px; }

      padding: 5px 8px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.95);

      font-size: 11px;
      outline: none;

    .pair-select-wrapper {

      overflow-y: auto;

      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #374151;
      padding: 4px;

    .signal-meta {

    }

      border-color: rgba(148, 163, 184, 0.6);
    }

    @media (max-width: 480px) {
      .glass-panel {
        right: 6px;
        left: 6px;
        bottom: 6px;
        width: auto;
      }
    }
  </style>

    const PAIRS = [

  { symbol: "EURUSD", label: "EUR/USD (Major)" },

  { symbol: "USDJPY", label: "USD/JPY (Major)" },

    function renderPairList(filteredPairs = PAIRS) {

}
    const pairSelectGroups = [

    const glassPanel = document.getElementById("glassPanel");

    let prevPrice = null;

    let selectedTimingSeconds = 0;
    let autoTimer = null;
    let currentPairValue = pairSelectGroups[0].value;

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.querySelectorAll("#timingButtons button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#timingButtons button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedTimingSeconds = Number(btn.dataset.seconds);
      });
    });

    function getSessionInfo() {
      const now = new Date();
      const utcHour = now.getUTCHours();
      let session = "Off Session";
      let booster = 0;

      if (utcHour >= 7 && utcHour < 13) {
        session = "London Session";
        booster = 3;
      }
      if (utcHour >= 13 && utcHour < 16) {
        session = "Overlap Session";
        booster = 5;
      }
      if (utcHour >= 16 && utcHour < 22) {
        session = "New York Session";
        booster = 4;
      }

      return { session, booster };
    }

    function EMA(candles, period) {
      if (!candles || candles.length < period) return { direction: "flat" };
      const last = candles[candles.length - 1];
      const first = candles[candles.length - period];
      const slope = last.close - first.close;
      if (slope > 0) return { direction: "up" };
      if (slope < 0) return { direction: "down" };
      return { direction: "flat" };
    }
    function Keltner(candles) {
      if (!candles || candles.length < 10) return { direction: "flat", middleSlope: "flat" };
      const last = candles[candles.length - 1];
      const first = candles[candles.length - 10];
      const slope = last.close - first.close;
      const dir = slope > 0 ? "up" : slope < 0 ? "down" : "flat";
      return { direction: dir, middleSlope: dir };
    }
    function FRAMA(candles) { return EMA(candles, 14); }
    function Fractal(candles) {
      if (!candles || candles.length < 5) return { structure: "NONE" };
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 5];
      if (last.close > prev.close) return { structure: "HH-HL" };
      if (last.close < prev.close) return { structure: "LH-LL" };
      return { structure: "SIDEWAYS" };
    }

    function isBullish(c) { return c.close > c.open; }
    function isBearish(c) { return c.close < c.open; }

    function isBullishEngulfing(last, prev) {
      if (!last || !prev) return false;
      return (
        isBearish(prev) &&
        isBullish(last) &&
        last.open <= prev.close &&
        last.close >= prev.open
      );
    }

    function isBearishEngulfing(last, prev) {
      if (!last || !prev) return false;
      return (
        isBullish(prev) &&
        isBearish(last) &&
        last.open >= prev.close &&
        last.close <= prev.open
      );
    }

    function isBullishHarami(prev, last) {
      if (!last || !prev) return false;
      return (
        isBearish(prev) &&
        isBullish(last) &&
        last.open > prev.close &&
        last.close < prev.open
      );
    }

    function isBearishHarami(prev, last) {
      if (!last || !prev) return false;
      return (
        isBullish(prev) &&
        isBearish(last) &&
        last.open < prev.close &&
        last.close > prev.open
      );
    }

    function isPiercingLine(prev, last) {
      if (!last || !prev) return false;
      const midPrev = (prev.open + prev.close) / 2;
      return (
        isBearish(prev) &&
        isBullish(last) &&
        last.open < prev.low &&
        last.close > midPrev
      );
    }

    function isMorningStar(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3];
      const b = candles[candles.length - 2];
      const c = candles[candles.length - 1];
      return (
        isBearish(a) &&
        Math.abs(b.close - b.open) < Math.abs(a.open - a.close) * 0.3 &&
        isBullish(c) &&
        c.close > ((a.open + a.close) / 2)
      );
    }

    function isEveningStar(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3];
      const b = candles[candles.length - 2];
      const c = candles[candles.length - 1];
      return (
        isBullish(a) &&
        Math.abs(b.close - b.open) < Math.abs(c.open - c.close) * 0.3 &&
        isBearish(c) &&
        c.close < ((a.open + a.close) / 2)
      );
    }

    function isTweezerBottom(candles) {
      if (!candles || candles.length < 2) return false;
      const a = candles[candles.length - 2];
      const b = candles[candles.length - 1];
      return (
        isBearish(a) &&
        isBullish(b) &&
        Math.abs(a.low - b.low) <= (a.high - a.low) * 0.1
      );
    }

    function isTweezerTop(candles) {
      if (!candles || candles.length < 2) return false;
      const a = candles[candles.length - 2];
      const b = candles[candles.length - 1];
      return (
        isBullish(a) &&
        isBearish(b) &&
        Math.abs(a.high - b.high) <= (a.high - a.low) * 0.1
      );
    }

    function hasStrongWickDown(c) {
      if (!c) return false;
      const body = Math.abs(c.close - c.open);
      const lowerWick = c.open < c.close ? c.open - c.low : c.close - c.low;
      return lowerWick > body * 1.5;
    }

    function hasStrongWickUp(c) {
      if (!c) return false;
      const body = Math.abs(c.close - c.open);
      const upperWick = c.high - (c.open < c.close ? c.close : c.open);
      return upperWick > body * 1.5;
    }

    function getRecentHigh(candles, lookback = 10) {
      const slice = candles.slice(-lookback);
      return Math.max(...slice.map(c => c.high));
    }
    function getRecentLow(candles, lookback = 10) {
      const slice = candles.slice(-lookback);
      return Math.min(...slice.map(c => c.low));
    }

    function isLiquiditySweepDown(candles) {
      if (!candles || candles.length < 3) return false;
      const last = candles[candles.length - 1];
      const prevLow = getRecentLow(candles.slice(0, -1), 10);
      return last.low < prevLow && last.close > prevLow;
    }

    function isLiquiditySweepUp(candles) {
      if (!candles || candles.length < 3) return false;
      const last = candles[candles.length - 1];
      const prevHigh = getRecentHigh(candles.slice(0, -1), 10);
      return last.high > prevHigh && last.close < prevHigh;
    }

    function isLiquidityGrabDown(candles) { return isLiquiditySweepDown(candles); }
    function isLiquidityGrabUp(candles) { return isLiquiditySweepUp(candles); }

    function detectBullishOB(candles) {
      if (!candles || candles.length < 4) return false;
      const a = candles[candles.length - 4];
      const b = candles[candles.length - 3];
      const c = candles[candles.length - 2];
      const d = candles[candles.length - 1];

      const strongBear = isBearish(a) && (a.open - a.close) > Math.abs(b.close - b.open);
      const strongBullMove = isBullish(c) && isBullish(d) && d.close > a.open;

      return strongBear && strongBullMove;
    }

    function detectBearishOB(candles) {
      if (!candles || candles.length < 4) return false;
      const a = candles[candles.length - 4];
      const b = candles[candles.length - 3];
      const c = candles[candles.length - 2];
      const d = candles[candles.length - 1];

      const strongBull = isBullish(a) && (a.close - a.open) > Math.abs(b.open - b.close);
      const strongBearMove = isBearish(c) && isBearish(d) && d.close < a.open;

      return strongBull && strongBearMove;
    }

    function detectFVGFillBuy(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3];
      const b = candles[candles.length - 2];
      const c = candles[candles.length - 1];

      const gapUp = b.low > a.high;
      const fill = c.low <= a.high && c.close > b.low;

      return gapUp && fill;
    }

    function detectFVGFillSell(candles) {
      if (!candles || candles.length < 3) return false;
      const a = candles[candles.length - 3];
      const b = candles[candles.length - 2];
      const c = candles[candles.length - 1];

      const gapDown = b.high < a.low;
      const fill = c.high >= a.low && c.close < b.high;

      return gapDown && fill;
    }

    function isSwingHigh(candles, i) {
      if (i < 1 || i > candles.length - 2) return false;
      const prev = candles[i - 1], cur = candles[i], next = candles[i + 1];
      return cur.high > prev.high && cur.high > next.high;
    }
    function isSwingLow(candles, i) {
      if (i < 1 || i > candles.length - 2) return false;
      const prev = candles[i - 1], cur = candles[i], next = candles[i + 1];
      return cur.low < prev.low && cur.low < next.low;
    }

    function isBOSUp(candles) {
      if (!candles || candles.length < 5) return false;
      const highs = [];
      for (let i = 1; i < candles.length - 1; i++) {
        if (isSwingHigh(candles, i)) highs.push(candles[i].high);
      }
      if (highs.length < 2) return false;
      const lastHigh = highs[highs.length - 1];
      const prevHigh = highs[highs.length - 2];
      return lastHigh > prevHigh;
    }

    function isBOSDown(candles) {
      if (!candles || candles.length < 5) return false;
      const lows = [];
      for (let i = 1; i < candles.length - 1; i++) {
        if (isSwingLow(candles, i)) lows.push(candles[i].low);
      }
      if (lows.length < 2) return false;
      const lastLow = lows[lows.length - 1];
      const prevLow = lows[lows.length - 2];
      return lastLow < prevLow;
    }

    function isCHoCHUp(candles) { return isBOSUp(candles); }
    function isCHoCHDown(candles) { return isBOSDown(candles); }

    function isMMCModelBuy(candles) {
      return isBOSUp(candles) && isLiquiditySweepDown(candles);
    }

    function isMMCModelSell(candles) {
      return isBOSDown(candles) && isLiquiditySweepUp(candles);
    }

    function detectLongDistanceSNR(candles) {
      if (!candles || candles.length < 20) return { demand: null, supply: null };
      const highs = candles.map(c => c.high);
      const lows = candles.map(c => c.low);
      const maxHigh = Math.max(...highs);
      const minLow = Math.min(...lows);
      return { demand: minLow, supply: maxHigh };
    }

    function detectHiddenSNR(candles) {
      if (!candles || candles.length < 10) return { demand: null, supply: null };
      const midIndex = Math.floor(candles.length / 2);
      const slice = candles.slice(Math.max(0, midIndex - 5), midIndex + 5);
      const highs = slice.map(c => c.high);
      const lows = slice.map(c => c.low);
      return { demand: Math.min(...lows), supply: Math.max(...highs) };
    }

    function strongestZone(longSNR, hiddenSNR) {
      if (!longSNR || !hiddenSNR) return "NONE";
      const lastPrice = priceWindow[priceWindow.length - 1]?.close;
      const demand = hiddenSNR.demand || longSNR.demand;
      const supply = hiddenSNR.supply || longSNR.supply;
      if (lastPrice == null) return "NONE";
      if (demand && Math.abs(lastPrice - demand) < Math.abs(lastPrice - supply)) {
        return "STRONG_BUY_ZONE";
      }
      if (supply && Math.abs(lastPrice - supply) < Math.abs(lastPrice - demand)) {
        return "STRONG_SELL_ZONE";
      }
      return "NONE";
    }

    function trendEngine(candles) {
      const ema20 = EMA(candles, 20);
      const keltner = Keltner(candles);
      const frama = FRAMA(candles);
      const fractal = Fractal(candles);

      let score = 0;
      if (ema20.direction === "up") score++;
      if (keltner.middleSlope === "up") score++;
      if (frama.direction === "up") score++;
      if (fractal.structure === "HH-HL") score++;

      if (score >= 3) return "BUY";
      if (score <= 1) return "SELL";
      return "SIDEWAYS";
    }

    function indicatorEngine(candles) {
      return {
        ema20: EMA(candles, 20).direction,
        keltner: Keltner(candles).direction,
        frama: FRAMA(candles).direction,
        fractal: Fractal(candles).structure
      };
    }

    function advancedPriceAction(candles) {
      if (!candles || candles.length < 2) return "NONE";
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 2];

      if (isBullishEngulfing(last, prev)) return "BUY";
      if (isBearishEngulfing(last, prev)) return "SELL";

      if (isPiercingLine(prev, last)) return "BUY";
      if (isEveningStar(candles)) return "SELL";
      if (isMorningStar(candles)) return "BUY";

      if (isBullishHarami(prev, last)) return "BUY";
      if (isBearishHarami(prev, last)) return "SELL";

      if (isTweezerBottom(candles)) return "BUY";
      if (isTweezerTop(candles)) return "SELL";

      if (hasStrongWickDown(last)) return "BUY";
      if (hasStrongWickUp(last)) return "SELL";

      return "NONE";
    }

    function liquidityEngine(candles) {
      if (isLiquiditySweepDown(candles)) return "BUY";
      if (isLiquiditySweepUp(candles)) return "SELL";
      if (isLiquidityGrabDown(candles)) return "BUY";
      if (isLiquidityGrabUp(candles)) return "SELL";
      return "NONE";
    }

    function obFvgEngine(candles) {
      if (detectBullishOB(candles)) return "BUY";
      if (detectBearishOB(candles)) return "SELL";
      if (detectFVGFillBuy(candles)) return "BUY";
      if (detectFVGFillSell(candles)) return "SELL";
      return "NONE";
    }

    function smcEngine(candles) {
      if (isBOSUp(candles)) return "BUY";
      if (isBOSDown(candles)) return "SELL";
      if (isCHoCHUp(candles)) return "BUY";
      if (isCHoCHDown(candles)) return "SELL";
      if (isMMCModelBuy(candles)) return "BUY";
      if (isMMCModelSell(candles)) return "SELL";
      return "NONE";
    }

    function snrMasterStudy(candles) {
      const longSNR = detectLongDistanceSNR(candles);
      const hiddenSNR = detectHiddenSNR(candles);
      return strongestZone(longSNR, hiddenSNR);
    }

    function timingEngine(marketType, second) {
      if (marketType === "OTC") return (second >= 45 && second <= 50);
      if (marketType === "LIVE") return (second >= 55 && second <= 60);
      if (marketType === "CRYPTO") return (second >= 50 && second <= 55);
      if (marketType === "GOLD") return (second >= 50 && second <= 55);
      return false;
    }

    const PRICE_WINDOW_MAX = 150;

    function updatePriceWindowOptimized(price) {
      if (price == null) return;
      const candle = {
        open: prevPrice != null ? prevPrice : price,
        close: price,
        high: Math.max(prevPrice != null ? prevPrice : price, price),
        low: Math.min(prevPrice != null ? prevPrice : price, price)
      };
      priceWindow.push(candle);
      if (priceWindow.length > PRICE_WINDOW_MAX) {
        priceWindow.splice(0, priceWindow.length - PRICE_WINDOW_MAX);
      }
    }

    function computeTrendAndVolatilityOptimized() {
      const len = priceWindow.length;
      if (len < 2) {
        return { trendLabel: "Weak", trendArrow: "→ Sideways", volatility: 0 };
      }
      const first = priceWindow[0].close;
      const last = priceWindow[len - 1].close;
      const slope = last - first;

      let trendArrow = "→ Sideways";
      let trendLabel = "Weak";
      if (slope > 0.005) { trendArrow = "⬆ Strong Uptrend"; trendLabel = "Strong"; }
      else if (slope > 0.002) { trendArrow = "↗ Medium Uptrend"; trendLabel = "Medium"; }
      else if (slope < -0.005) { trendArrow = "⬇ Strong Downtrend"; trendLabel = "Strong"; }
      else if (slope < -0.002) { trendArrow = "↘ Medium Downtrend"; trendLabel = "Medium"; }

      let sumAbs = 0;
      for (let i = 1; i < len; i++) {
        sumAbs += Math.abs(priceWindow[i].close - priceWindow[i - 1].close);
      }
      const volatility = sumAbs / (len - 1);

      return { trendLabel, trendArrow, volatility };
    }

    function accuracyBooster(trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk, baseDirection, baseScore) {
      let confirmations = 0;

      if (trend === "BUY" || trend === "SELL") confirmations++;
      if (indicator.ema20 === "up" || indicator.ema20 === "down") confirmations++;
      if (pa === "BUY" || pa === "SELL") confirmations++;
      if (liquidity === "BUY" || liquidity === "SELL") confirmations++;
      if (obfvg === "BUY" || obfvg === "SELL") confirmations++;
      if (smc === "BUY" || smc === "SELL") confirmations++;
      if (snr === "STRONG_BUY_ZONE" || snr === "STRONG_SELL_ZONE") confirmations++;
      if (timingOk) confirmations++;

      let dir = baseDirection;
      let score = baseScore;

      if (confirmations <= 2) {
        dir = "NEUTRAL";
        score = Math.min(score, 30);
      }

      if (confirmations === 3 || confirmations === 4) {
        score = Math.min(score, 70);
      }

      if (confirmations >= 5) {
        score = Math.max(score, 60);
      }

      if ((dir === "BUY" || dir === "SELL") && score < 40) {
        dir = "NEUTRAL";
      }

      score = Math.max(0, Math.min(100, score));
      return { direction: dir, score };
    }

    function isOTC(pairValue) {
      return pairValue.startsWith("otc:");
    }

    function otcPatternBoost(candles) {
      if (!candles || candles.length < 3) return "NONE";
      const last = candles[candles.length - 1];
      const prev = candles[candles.length - 2];
      const prev2 = candles[candles.length - 3];

      if (isBearish(prev2) && isBullish(prev) && isBearish(last)) {
        return "SELL";
      }
      if (isBullish(prev2) && isBearish(prev) && isBullish(last)) {
        return "BUY";
      }

      if (hasStrongWickUp(prev) && hasStrongWickUp(last)) return "SELL";
      if (hasStrongWickDown(prev) && hasStrongWickDown(last)) return "BUY";

      return "NONE";
    }

    function otcLiquidityBoost(candles) {
      if (!candles || candles.length < 2) return "NONE";
      const last = candles[candles.length - 1];
      if (isLiquiditySweepDown(candles) && hasStrongWickDown(last)) {
        return "BUY";
      }
      if (isLiquiditySweepUp(candles) && hasStrongWickUp(last)) {
        return "SELL";
      }
      return "NONE";
    }

    function otcSNRBoost(candles) {
      if (!candles || candles.length < 10) return "NONE";
      const last = candles[candles.length - 1];
      const lows = candles.slice(-10).map(c => c.low);
      const highs = candles.slice(-10).map(c => c.high);
      const minLow = Math.min(...lows);
      const maxHigh = Math.max(...highs);
      const tol = (maxHigh - minLow) * 0.1 || 0.0005;

      if (Math.abs(last.close - minLow) < tol) return "STRONG_BUY_ZONE";
      if (Math.abs(last.close - maxHigh) < tol) return "STRONG_SELL_ZONE";
      return "NONE";
    }

    function otcBoosterDecision(pairValue, candles, baseDirection, baseScore) {
      if (!isOTC(pairValue)) return { direction: baseDirection, score: baseScore };

      const patternBoost = otcPatternBoost(candles);
      const liqBoost = otcLiquidityBoost(candles);
      const snrBoost = otcSNRBoost(candles);

      let dir = baseDirection;
      let score = baseScore;

      if (patternBoost === "BUY" || liqBoost === "BUY" || snrBoost === "STRONG_BUY_ZONE") {
        if (dir === "BUY") score += 10;
        else if (dir === "NEUTRAL") { dir = "BUY"; score += 8; }
      }

      if (patternBoost === "SELL" || liqBoost === "SELL" || snrBoost === "STRONG_SELL_ZONE") {
        if (dir === "SELL") score += 10;
        else if (dir === "NEUTRAL") { dir = "SELL"; score += 8; }
      }

      score = Math.max(0, Math.min(100, score));
      return { direction: dir, score };
    }

    function detectBreakoutAndRetest(current) {
      if (priceWindow.length < 5 || current == null) {
        return { isBreakout: false, isRetest: false };
      }
      const closes = priceWindow.map(c => c.close);
      const max = Math.max(...closes);
      const min = Math.min(...closes);
      const tolerance = (max - min) * 0.05 || 0.0005;
      const isBreakout = current > max + tolerance || current < min - tolerance;
      let isRetest = false;
      if (!isBreakout) {
        if (Math.abs(current - max) < tolerance || Math.abs(current - min) < tolerance) {
          isRetest = true;
        }
      }
      return { isBreakout, isRetest };
    }

    function computeRiskLevel(volatility, percentChange, isBreakout, isRetest) {
      const v = volatility || 0;
      const p = Math.abs(percentChange || 0);
      let score = 0;
      if (v > 0.5 || p > 0.5) score += 2;
      if (v > 0.2 || p > 0.2) score += 1;
      if (isBreakout) score += 2;
      if (isRetest) score -= 1;
      if (score <= 1) return "Low Risk";
      if (score === 2) return "Medium Risk";
      return "High Risk";
    }

    function strategyLayer(trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk) {
      const buySignals = [
        trend === "BUY",

      ];

      const buyMatch = buySignals.filter(x => x === true).length;
      const sellMatch = sellSignals.filter(x => x === true).length;

      if (buyMatch >= 4) return "BUY";

    }

    function updateMarketStatus(pairValue) {

    async function fetchQuote(pairValue) {
      const [type, provider, symbol] = pairValue.split(":");
      let url = null;
      let source = "Live";

      if (type === "forex") {
  url = `https://finnhub.io/api/v1/forex/quote?symbol=${provider}:${symbol}&token=${FINNHUB_API_KEY}`;
}
else if (type === "crypto") {
  url = `https://finnhub.io/api/v1/crypto/quote?symbol=${provider}:${symbol}&token=${FINNHUB_API_KEY}`;
}
else {
  source = "Simulated";
}

      if (!url) {
        const price = prevPrice != null
          ? prevPrice + (Math.random() - 0.5) * 0.01
          : 1 + Math.random();

        prevPrice = price;

        return {
          currentPrice: price,

          source
        };

      try {

        const data = await res.json();

        const change = data.d != null ? data.d : (Math.random() - 0.5) * 0.01;
        const percentChange = data.dp != null ? data.dp : (Math.random() - 0.5) * 0.3;

        prevPrice = currentPrice;

        return { currentPrice, change, percentChange, source };
      } catch (e) {
        const price = prevPrice != null
          ? prevPrice + (Math.random() - 0.5) * 0.01
          : 1 + Math.random();

        prevPrice = price;

        return {
          currentPrice: price,
          change: (Math.random() - 0.5) * 0.01,
          percentChange: (Math.random() - 0.5) * 0.3,
          source: "Simulated (Fallback)"
        };
      }
    }

   function getSelectedPairValue() {

    async function generateSignal(triggerMode) {
      const pairValue = getSelectedPairValue();
      currentPairValue = pairValue;
      if (!pairValue) return;

      updateMarketStatus(pairValue);

      const quote = await fetchQuote(pairValue);
      const currentPrice = quote.currentPrice;
      const change = quote.change;
      const percentChange = quote.percentChange;

      updatePriceWindowOptimized(currentPrice);

      const { trendLabel, trendArrow, volatility } = computeTrendAndVolatilityOptimized();
      const { isBreakout, isRetest } = detectBreakoutAndRetest(currentPrice);
      const riskLevel = computeRiskLevel(volatility, percentChange, isBreakout, isRetest);
      const { session } = getSessionInfo();

      const marketType =
        pairValue.startsWith("forex") ? "LIVE" :
        pairValue.startsWith("crypto") ? "CRYPTO" :
        pairValue.startsWith("otc") ? "OTC" :
        pairValue.includes("XAU") ? "GOLD" : "LIVE";

      const trend = trendEngine(priceWindow);
      const indicator = indicatorEngine(priceWindow);
      const pa = advancedPriceAction(priceWindow);
      const liquidity = liquidityEngine(priceWindow);
      const obfvg = obFvgEngine(priceWindow);
      const smc = smcEngine(priceWindow);
      const snr = snrMasterStudy(priceWindow);

      const now = new Date();
      const second = now.getSeconds();
      const timingOk = timingEngine(marketType, second);

      let direction = strategyLayer(trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk);

      let baseScore =
        (trend === "BUY" || trend === "SELL" ? 20 : 0) +
        (indicator.ema20 === "up" || indicator.ema20 === "down" ? 15 : 0) +
        (pa === "BUY" || pa === "SELL" ? 15 : 0) +
        (liquidity === "BUY" || liquidity === "SELL" ? 10 : 0) +
        (obfvg === "BUY" || obfvg === "SELL" ? 10 : 0) +
        (smc === "BUY" || smc === "SELL" ? 10 : 0) +
        (snr === "STRONG_BUY_ZONE" || snr === "STRONG_SELL_ZONE" ? 10 : 0) -
        volatility * 50;

      baseScore = Math.max(0, Math.min(100, Math.round(baseScore)));

      const accBoost = accuracyBooster(
        trend, indicator, pa, liquidity, obfvg, smc, snr, timingOk,
        direction, baseScore
      );

      let boostedDirection = accBoost.direction;
      let boostedScore = accBoost.score;

      const otcBoost = otcBoosterDecision(pairValue, priceWindow, boostedDirection, boostedScore);
      const finalDirection = otcBoost.direction;
      const finalScore = otcBoost.score;

      const pairText = getSelectedPairText();
      
      signalDirectionEl.textContent = finalDirection;
      signalDirectionEl.className =
        "signal-direction " +
        (finalDirection === "BUY" ? "buy" :
         finalDirection === "SELL" ? "sell" : "neutral");

      signalScoreEl.textContent = "Score: " + finalScore;
      riskLevelEl.textContent = riskLevel;
      trendArrowEl.textContent = trendArrow;
      sessionInfoEl.textContent = session;
      modeInfoEl.textContent = triggerMode === "auto" ? "Auto" : "Manual";
      timingInfoEl.textContent = selectedTimingSeconds ? selectedTimingSeconds + "s" : "Auto";
      sourceInfoEl.textContent = quote.source;

      setGlow(finalDirection);
      showPopupAlert(`${finalDirection} | Score ${finalScore} | ${riskLevel}`);

      addHistoryEntry({
        time: new Date().toLocaleTimeString(),
        broker: brokerSelect.value,
        pair: pairText,
        mode: triggerMode === "auto" ? "Auto" : "Manual",
        timing: selectedTimingSeconds || 0,
        direction: finalDirection,
        score: finalScore,
        risk: riskLevel
      });

      prevPrice = currentPrice;
    }

    function startAutoMode(seconds) {
      stopAutoMode();
      const intervalSec = seconds || selectedTimingSeconds || 10;
      autoTimer = setInterval(() => {
        generateSignal("auto");
      }, intervalSec * 1000);
      autoToggleBtn.textContent = "Auto: ON";
    }

    function stopAutoMode() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
      autoToggleBtn.textContent = "Auto: OFF";
    }

    autoToggleBtn.addEventListener("click", () => {
      if (autoTimer) {
        stopAutoMode();
      } else {
        startAutoMode();
      }
    });

    createSignalBtn.addEventListener("click", () => {
      generateSignal("manual");
    });
  
    brokerSelect.addEventListener("change", () => {});

    function initPanelPosition() {
      const saved = localStorage.getItem("glassPanelPosition");
      if (saved) {
        try {
          const pos = JSON.parse(saved);
          glassPanel.style.left = pos.left + "px";
          glassPanel.style.top = pos.top + "px";
          glassPanel.style.right = "auto";
          glassPanel.style.bottom = "auto";
        } catch (e) {}
      }
    }

    function enablePanelDrag() {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;

      function onMouseDown(e) {
        isDragging = true;
        const rect = glassPanel.getBoundingClientRect();
        startX = e.clientX;
        startY = e.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
      }

      function onMouseMove(e) {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const newLeft = Math.max(
  0,
  Math.min(
    window.innerWidth - glassPanel.offsetWidth,
    startLeft + dx
  )
);

const newTop = Math.max(
  0,
  Math.min(
    window.innerHeight - glassPanel.offsetHeight,
    startTop + dy
  )
);
        glassPanel.style.left = newLeft + "px";
        glassPanel.style.top = newTop + "px";
        glassPanel.style.right = "auto";
        glassPanel.style.bottom = "auto";
      }

      function onMouseUp() {
        if (!isDragging) return;
        isDragging = false;
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
        const rect = glassPanel.getBoundingClientRect();
        localStorage.setItem("glassPanelPosition", JSON.stringify({
          left: rect.left,
          top: rect.top
        }));
      }

      function onTouchStart(e) {
        if (e.touches.length !== 1) return;
        isDragging = true;
        const touch = e.touches[0];
        const rect = glassPanel.getBoundingClientRect();
        startX = touch.clientX;
        startY = touch.clientY;
        startLeft = rect.left;
        startTop = rect.top;
        document.addEventListener("touchmove", onTouchMove);
        document.addEventListener("touchend", onTouchEnd);
      }

      function onTouchMove(e) {
        if (!isDragging || e.touches.length !== 1) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        const newLeft = startLeft + dx;
        const newTop = startTop + dy;
        glassPanel.style.left = newLeft + "px";
        glassPanel.style.top = newTop + "px";
        glassPanel.style.right = "auto";
        glassPanel.style.bottom = "auto";
      }

      function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;
        document.removeEventListener("touchmove", onTouchMove);
        document.removeEventListener("touchend", onTouchEnd);
        const rect = glassPanel.getBoundingClientRect();
        localStorage.setItem("glassPanelPosition", JSON.stringify({
          left: rect.left,
          top: rect.top
        }));
      }

      glassHeader.addEventListener("mousedown", onMouseDown);
      glassHeader.addEventListener("touchstart", onTouchStart, { passive: true });
    }
pairSearchInput.addEventListener("input", () => {

  const query =
    pairSearchInput.value.toLowerCase();

  const filtered =
    PAIRS.filter(pair =>
      pair.label
        .toLowerCase()
        .includes(query)
    );

  renderPairList(filtered);

});

    initPanelPosition();
    enablePanelDrag();
